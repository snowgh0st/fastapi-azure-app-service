<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client CRUD Manager</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Client Manager</h2>

    <!-- Create/Update Form -->
    <div>
        <input type="text" id="clientCode" placeholder="Client Code">
        <input type="text" id="clientName" placeholder="Client Name">
        <button onclick="saveClient()">Save / Update</button>
    </div>

    <!-- Client List -->
    <h3>Client List</h3>
    <ul id="clientList"></ul>

    <script>
        const API_URL = "http://localhost:8000"; // Change to hosted API URL after deployment

        async function loadClients() {
            const res = await fetch(`${API_URL}/clients/`);
            const data = await res.json();
            const list = document.getElementById('clientList');
            list.innerHTML = '';
            data.forEach(c => {
                list.innerHTML += `
                    <li>
                        <strong>${c.ClientCode}</strong>: ${c.ClientName} 
                        <button onclick="deleteClient('${c.ClientCode}')">Delete</button>
                    </li>`;
            });
        }

        async function saveClient() {
            const code = document.getElementById('clientCode').value;
            const name = document.getElementById('clientName').value;
            
            // Attempt to update first (or implement backend Upsert logic)
            const method = 'POST'; // Switch to PUT if updating existing
            await fetch(`${API_URL}/clients/`, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ClientCode: code, ClientName: name })
            });
            loadClients();
        }

        async function deleteClient(code) {
            await fetch(`${API_URL}/clients/${code}`, { method: 'DELETE' });
            loadClients();
        }

        loadClients();
    </script>
</body>
</html>
